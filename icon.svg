<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="铃芽：铃身樱花、双色新芽与花苞">
        <defs>
          <linearGradient id="rinGold" x1="0" y1="0" x2=".25" y2="1">
            <stop offset="0" stop-color="#f9e2b6"/><stop offset="1" stop-color="#e4b06a"/>
          </linearGradient>
          <linearGradient id="rinPink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9d2d9"/><stop offset="1" stop-color="#e9a0b0"/>
          </linearGradient>
          <linearGradient id="rinTeal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#bcd8d6"/><stop offset="1" stop-color="#7fadb0"/>
          </linearGradient>
        </defs>
        <!-- 芽：茎 -->
        <path d="M32 10.6v8.2" stroke="#6b5a48" stroke-width="1.9" stroke-linecap="round"/>
        <!-- 左叶（海青） -->
        <path d="M31.9 14.5C26.2 14.6 21.8 12 20 7.5c5.4-.7 10.1 2.1 11.9 7z" fill="url(#rinTeal)" stroke="#6b5a48" stroke-width="1.4" stroke-linejoin="round"/>
        <!-- 右叶（樱粉） -->
        <path d="M32.1 14.5C37.9 14.3 42.5 11.5 44 6.9c-5.5-.4-10.2 2.7-11.9 7.6z" fill="url(#rinPink)" stroke="#6b5a48" stroke-width="1.4" stroke-linejoin="round"/>
        <!-- 花苞 -->
        <path d="M32 3.6c1.5 1.8 2.3 3.3 2.3 4.7 0 1.5-1 2.5-2.3 2.5s-2.3-1-2.3-2.5c0-1.4.8-2.9 2.3-4.7z" fill="url(#rinPink)" stroke="#6b5a48" stroke-width="1.25" stroke-linejoin="round"/>
        <!-- 铃舌短杆从铃口内伸出，铃身与铃舌覆盖两端 -->
        <path d="M32 47.8v8" stroke="#6b5a48" stroke-width="1.6" stroke-linecap="round"/>
        <!-- 铃身 -->
        <path d="M32 17.4c-2.4 0-4.4 1.9-4.4 4.3v1.2c-6.9 2.9-10.7 8.6-10.7 15.4v4.6c0 1.6-.8 3-2.1 3.9-1 .8-.5 2.4.8 2.4h32.8c1.3 0 1.8-1.6.8-2.4-1.3-.9-2.1-2.3-2.1-3.9v-4.6c0-6.8-3.8-12.5-10.7-15.4v-1.2c0-2.4-2-4.3-4.4-4.3z" fill="url(#rinGold)" stroke="#6b5a48" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 铃身樱花 -->
        <g transform="translate(32,39.2)">
          <g fill="url(#rinPink)" stroke="#6b5a48" stroke-width="1.05">
            <ellipse cx="0" cy="-4" rx="2.4" ry="3.4"/>
            <ellipse cx="0" cy="-4" rx="2.4" ry="3.4" transform="rotate(72)"/>
            <ellipse cx="0" cy="-4" rx="2.4" ry="3.4" transform="rotate(144)"/>
            <ellipse cx="0" cy="-4" rx="2.4" ry="3.4" transform="rotate(216)"/>
            <ellipse cx="0" cy="-4" rx="2.4" ry="3.4" transform="rotate(288)"/>
          </g>
          <circle r="1.3" fill="#e58fa0" stroke="#6b5a48" stroke-width=".9"/>
        </g>
        <!-- 铃舌 -->
        <circle cx="32" cy="56.2" r="2.9" fill="url(#rinPink)" stroke="#6b5a48" stroke-width="1.5"/>
      </svg>